<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة تحكم SAIF OFFICIEL</title>
<style>
body{margin:0;padding:0;font-family:Tahoma;background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);color:#fff;display:flex;justify-content:center;align-items:center;height:100vh}
.container{width:400px;padding:30px;border-radius:20px;background:rgba(255,255,255,0.08);box-shadow:0 0 25px rgba(0,0,0,0.6);text-align:center}
input{width:90%;padding:12px;margin:10px 0;border:none;border-radius:8px;outline:none}
button{width:95%;padding:12px;margin-top:10px;border:none;border-radius:8px;background:linear-gradient(45deg,#0072ff,#00c6ff);color:#fff;font-weight:bold;cursor:pointer}
button:hover{transform:scale(1.05)}
.msg{margin-top:10px;color:#ffd700}
a{color:#ffdd00;text-decoration:none;font-weight:bold}
a:hover{text-decoration:underline}
.hidden{display:none}
</style>
</head>
<body>

<div class="container" id="loginBox">
  <h1>SAIF OFFICIEL</h1>
  <h2>تسجيل الدخول</h2>
  <input type="text" id="username" placeholder="اسم المستخدم">
  <input type="password" id="password" placeholder="كلمة المرور">
  <button onclick="login()">دخول</button>
  <div class="msg" id="loginMsg"></div>
</div>

<div class="container hidden" id="panelBox">
  <h1>لوحة التحكم</h1>
  <input type="text" id="uid" placeholder="أدخل UID">
  <input type="number" id="duration" placeholder="المدة بالدقائق">
  <button onclick="startAction()">بدء</button>
  <div class="msg" id="result"></div>
  <a href="https://instagram.com/saif._.officiel" target="_blank">تواصل معي على Instagram</a>
  <button onclick="logout()" style="margin-top:15px;background:linear-gradient(45deg,#ff416c,#ff4b2b)">تسجيل خروج</button>
</div>

<script>
const USERNAME = "saif2026";
const PASSWORD = "saif2008";

function login(){
    const u = document.getElementById("username").value;
    const p = document.getElementById("password").value;
    if(u===USERNAME && p===PASSWORD){
        document.getElementById("loginBox").classList.add("hidden");
        document.getElementById("panelBox").classList.remove("hidden");
    }else{
        document.getElementById("loginMsg").innerText="بيانات تسجيل الدخول غير صحيحة";
    }
}

async function startAction(){
    const uid = document.getElementById("uid").value.trim();
    const duration = document.getElementById("duration").value.trim();
    if(!uid || !duration){
        document.getElementById("result").innerText="يرجى إدخال UID والمدة";
        return;
    }

    try {
        // 🔹 جلب بيانات اللاعب من API المعلومات
        const infoResp = await fetch(`https://ch9ayfa-info-v10-production.up.railway.app/get?uid=${uid}`);
        const infoData = await infoResp.json();

        // استخراج البيانات الصحيحة
        const playerName = infoData.data.basicInfo.nickname || "غير معروف";
        const playerLevel = infoData.data.basicInfo.level || "غير معروف";

        document.getElementById("result").innerHTML = `
          <p>تم بداء مقبرة السبام</p>
          <p>NAME: ${playerName}</p>
          <p>LEVEL: ${playerLevel}</p>
          <p>مدات مقبرة السبام بالدقائق: ${duration}</p>
        `;

        // 🔹 تنفيذ طلب السبام (اختياري، إذا أردت)
        // fetch(`http://spam-room-over.onrender.com/spam?user_id=${uid}&duration=${duration}`);

    } catch(err){
        document.getElementById("result").innerText="حدث خطأ في جلب معلومات اللاعب";
    }
}

function logout(){
    location.reload();
}

// 🔒 حماية بسيطة
document.addEventListener("contextmenu", e => e.preventDefault());
document.onkeydown = function(e){
    if(e.keyCode==123) return false; // F12
    if(e.ctrlKey && e.shiftKey && e.keyCode==73) return false; // Ctrl+Shift+I
    if(e.ctrlKey && e.keyCode==85) return false; // Ctrl+U
};
</script>

</body>
</html>
